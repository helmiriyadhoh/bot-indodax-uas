name: tick
on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # menit selain 0 supaya tidak antre; idempotency menjamin tiap candle diproses sekali
  workflow_dispatch:
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Panggil /api/tick
        run: |
          curl -fsS --retry 3 --retry-delay 5 --max-time 150 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.TICK_URL }}"
